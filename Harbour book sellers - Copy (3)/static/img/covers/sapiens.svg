<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291508" />
      <stop offset="50%" stop-color="#58260b" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#fdba74" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="spineCrease" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="15%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="800" height="1200" fill="url(#bgGrad)" />

  <!-- Textured grain overlay -->
  <rect width="800" height="1200" fill="none" stroke="url(#goldBorder)" stroke-width="2" />
  
  <!-- Outer decorative border frame -->
  <rect x="36" y="36" width="728" height="1128" rx="8" fill="none" stroke="#fdba74" stroke-width="1.5" opacity="0.4" />
  <rect x="46" y="46" width="708" height="1108" rx="6" fill="none" stroke="#fdba74" stroke-width="0.75" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Spine 3D crease effect -->
  <rect x="0" y="0" width="38" height="1200" fill="url(#spineCrease)" />

  <!-- Top Genre Badge -->
  <g transform="translate(400, 150)" text-anchor="middle">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#fdba74" fill-opacity="0.12" stroke="#fdba74" stroke-width="1.2" opacity="0.9" />
    <text y="7" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#fdba74">A BRIEF HISTORY OF HUMANKIND</text>
  </g>

  <!-- Title & Author Block -->
  <g text-anchor="middle">
    <text x="400" y="270" font-family="'Outfit', 'Georgia', serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#shadow)">Sapiens</text>
    <line x1="330" y1="310" x2="470" y2="310" stroke="#fdba74" stroke-width="3" stroke-linecap="round" />
    <text x="400" y="350" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="1">BY YUVAL NOAH HARARI</text>
  </g>

  <!-- Center Artwork Motif -->
  <g>
    
            <circle cx="400" cy="540" r="140" fill="none" stroke="#fdba74" stroke-width="2" opacity="0.5"/>
            <circle cx="400" cy="540" r="90" fill="#c2410c" opacity="0.6"/>
            <!-- Stylized evolutionary rings & handprint symbol -->
            <path d="M 370 500 Q 370 470 385 470 Q 400 470 400 500 L 400 550" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 405 480 Q 405 450 420 450 Q 435 450 435 480 L 435 550" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 440 505 Q 440 480 455 480 Q 470 480 470 505 L 470 550" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 345 530 Q 345 510 360 510 Q 370 510 370 535 L 370 560" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 360 560 Q 370 600 420 600 Q 470 600 470 560" stroke="#fef08a" stroke-width="14" stroke-linecap="round" fill="none"/>
        
  </g>

  <!-- Bottom Brand Mark & Seal -->
  <g transform="translate(400, 1070)" text-anchor="middle">
    <line x1="-150" y1="-40" x2="150" y2="-40" stroke="#cbd5e1" stroke-width="1" opacity="0.2" />
    <text y="0" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.85">HARBOUR BOOKS</text>
    <text y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#94a3b8">SPECIALLY CURATED EDITION</text>
  </g>
</svg>