<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="spineCrease" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="15%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="800" height="1200" fill="url(#bgGrad)" />

  <!-- Textured grain overlay -->
  <rect width="800" height="1200" fill="none" stroke="url(#goldBorder)" stroke-width="2" />
  
  <!-- Outer decorative border frame -->
  <rect x="36" y="36" width="728" height="1128" rx="8" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.4" />
  <rect x="46" y="46" width="708" height="1108" rx="6" fill="none" stroke="#fde047" stroke-width="0.75" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Spine 3D crease effect -->
  <rect x="0" y="0" width="38" height="1200" fill="url(#spineCrease)" />

  <!-- Top Genre Badge -->
  <g transform="translate(400, 150)" text-anchor="middle">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#fde047" fill-opacity="0.12" stroke="#fde047" stroke-width="1.2" opacity="0.9" />
    <text y="7" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#fde047">PHILOSOPHICAL FICTION</text>
  </g>

  <!-- Title & Author Block -->
  <g text-anchor="middle">
    <text x="400" y="270" font-family="'Outfit', 'Georgia', serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#shadow)">The Alchemist</text>
    <line x1="330" y1="310" x2="470" y2="310" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
    <text x="400" y="350" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="1">BY PAULO COELHO</text>
  </g>

  <!-- Center Artwork Motif -->
  <g>
    
            <circle cx="400" cy="550" r="160" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
            <polygon points="400,420 480,590 320,590" fill="none" stroke="#fde047" stroke-width="3" opacity="0.8"/>
            <polygon points="400,680 480,510 320,510" fill="none" stroke="#fde047" stroke-width="2" opacity="0.5"/>
            <circle cx="400" cy="550" r="28" fill="#fde047" opacity="0.9"/>
            <path d="M 220 780 Q 400 700 580 780 L 580 880 L 220 880 Z" fill="#92400e" opacity="0.7"/>
            <path d="M 260 810 Q 400 750 540 810 L 540 880 L 260 880 Z" fill="#b45309" opacity="0.8"/>
            <circle cx="280" cy="460" r="3" fill="#fff" opacity="0.8"/>
            <circle cx="510" cy="480" r="4" fill="#fff" opacity="0.7"/>
            <circle cx="470" cy="390" r="3" fill="#fff" opacity="0.9"/>
        
  </g>

  <!-- Bottom Brand Mark & Seal -->
  <g transform="translate(400, 1070)" text-anchor="middle">
    <line x1="-150" y1="-40" x2="150" y2="-40" stroke="#cbd5e1" stroke-width="1" opacity="0.2" />
    <text y="0" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.85">HARBOUR BOOKS</text>
    <text y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#94a3b8">SPECIALLY CURATED EDITION</text>
  </g>
</svg>