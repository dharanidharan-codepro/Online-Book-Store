{% load static %}
<div id="signInModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <button class="modal-close" type="button" aria-label="Close sign in">×</button>
        <div class="sign-in-card">
            <div class="card-header text-center mb-3">
                <img src="{% static 'img/harbour-books-logo.jpg' %}" alt="Harbour Books logo" class="modal-logo">
                <h3 id="login-title" class="mt-2 text-white fw-bold">Welcome back</h3>
                <p class="text-muted small">Sign in to your Harbour Books account</p>
            </div>

            <form method="post" action="{% url 'customer_login' %}" autocomplete="on">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                
                <div class="mb-3 text-start">
                    <label for="login-username" class="auth-label"><i class="bi bi-person"></i> Username</label>
                    <input id="login-username" class="auth-input" type="text" name="username" placeholder="Enter username" autocomplete="username" required autofocus>
                </div>
                
                <div class="mb-3 text-start">
                    <label for="login-password" class="auth-label"><i class="bi bi-lock"></i> Password</label>
                    <div class="position-relative">
                        <input id="login-password" class="auth-input" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required style="padding-right: 42px;">
                        <button type="button" 
                                class="btn position-absolute end-0 top-50 translate-middle-y text-muted border-0 bg-transparent py-0 px-3" 
                                id="toggleModalPassword"
                                aria-label="Toggle password visibility"
                                tabindex="-1">
                            <i class="bi bi-eye" id="toggleModalIcon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-amber w-100 mt-3 py-2 fw-bold fs-6">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="mt-3 text-center border-top pt-3" style="border-color: rgba(255,255,255,0.08) !important;">
                <span class="text-muted small">Don’t have an account?</span> 
                <a href="{% url 'register' %}" class="fw-semibold text-warning ms-1">Create one</a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const toggle = document.getElementById('toggleModalPassword');
    const pwd = document.getElementById('login-password');
    const icon = document.getElementById('toggleModalIcon');
    if (toggle && pwd && icon) {
        toggle.addEventListener('click', function(e){
            e.preventDefault();
            const isPassword = pwd.getAttribute('type') === 'password';
            pwd.setAttribute('type', isPassword ? 'text' : 'password');
            icon.classList.toggle('bi-eye', !isPassword);
            icon.classList.toggle('bi-eye-slash', isPassword);
        });
    }
});
</script>
