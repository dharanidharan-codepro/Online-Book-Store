
{% extends 'base.html' %}
{% block title %}{{ category.name }} | Harbour Books{% endblock %}
{% block content %}
<div class="container py-5">
    <h1>{{ category.name }}</h1>
    <div class="book-grid catalog-grid">
        {% for book in books %}
            {% include 'catalog/_book_card.html' %}
        {% empty %}
            <p>No books in this category yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
