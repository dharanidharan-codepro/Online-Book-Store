{% load static %}
<article class="book-card p-3 rounded-4 shadow-sm h-100 d-flex flex-column" style="background: rgba(17, 26, 46, 0.72); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
    <div class="position-relative mb-3 text-center overflow-hidden rounded-3" style="aspect-ratio: 2/3; background: #070c16;">
        <a href="{{ book.get_absolute_url }}" class="d-block w-100 h-100">
            <img src="{{ book.cover_url }}" alt="{{ book.title }}" class="w-100 h-100 object-fit-cover rounded-3 book-cover" loading="lazy">
        </a>
        {% if book.is_best_seller %}
            <span class="position-absolute top-0 start-0 m-2 badge bg-warning text-dark fw-bold rounded-pill shadow">
                <i class="bi bi-star-fill"></i> Best Seller
            </span>
        {% elif book.is_new_arrival %}
            <span class="position-absolute top-0 start-0 m-2 badge bg-success text-light fw-bold rounded-pill shadow">
                <i class="bi bi-sparkles"></i> New
            </span>
        {% endif %}
        {% if book.is_audiobook %}
            <span class="position-absolute bottom-0 end-0 m-2 badge bg-info text-dark rounded-circle shadow" title="Audiobook">
                <i class="bi bi-headphones"></i>
            </span>
        {% endif %}
    </div>

    <div class="d-flex flex-column flex-grow-1">
        <div class="small text-muted mb-1 text-uppercase fw-semibold" style="font-size: 0.75rem;">
            {{ book.category.name|default:"General" }}
        </div>
        <h5 class="fw-bold mb-1 text-truncate" title="{{ book.title }}">
            <a href="{{ book.get_absolute_url }}" class="text-light text-decoration-none">
                {{ book.title }}
            </a>
        </h5>
        <p class="small text-secondary mb-3 text-truncate">by {{ book.author }}</p>

        <div class="mt-auto d-flex align-items-center justify-content-between pt-2 border-top" style="border-color: rgba(255,255,255,0.08) !important;">
            <div class="fs-5 fw-bold text-warning">₹{{ book.price }}</div>
            <form method="post" action="{% url 'store:cart_add' book.id %}">
                {% csrf_token %}
                <input type="hidden" name="quantity" value="1">
                <button type="submit" class="btn btn-sm btn-amber px-3 py-1 fw-bold rounded-pill">
                    <i class="bi bi-bag-plus"></i> Buy
                </button>
            </form>
        </div>
    </div>
</article>
